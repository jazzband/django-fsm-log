[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
license = "MIT"
license-files = ["LICENSE"]
description = "Transition's persistence for django-fsm"
name = "django-fsm-log"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Gizmag", email = "tech@gizmag.com" },
  { name = "Various Contributors" },
]
keywords = ["django", "django-fsm-2"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["django>=4.2", "django-fsm-2", "django_appconf"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-mock",
  "tox",
  "tox-uv>=1.17.0",
]
ci = ["codecov>=2.1.13"]
docs = ["sphinx", "sphinx_rtd_theme", "myst-parser"]

[project.urls]
Documentation = "https://django-fsm-log.readthedocs.io/en/latest/"
Homepage = "https://github.com/jazzband/django-fsm-log"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = ["django_fsm_log"]

[tool.hatch.build.targets.wheel]
packages = ["django_fsm_log"]

[tool.ruff]
line-length = 119
target-version = "py310"
extend-exclude = ["django_fsm_log/migrations/", ".tox/", "build/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "T20", "TID", "UP", "DJ"]

[tool.pytest.ini_options]
markers = [
  "ignore_article: Configure the settings DJANGO_FSM_LOG_IGNORED_MODELS to ignore Article Model.",
  "pending_objects: Install PendingStateLogManager on StateLog",
]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"


[tool.coverage.run]
source = ["django_fsm_log"]

[tool.coverage.report]
show_missing = true

[tool.tox]
env_list = [
  "lint",
  { product = [
    { python_version = { prefix = "py3", start = 11, end = 15 } },
    { django_version = [
      "dj52",
      "dj60",
      "dj61",
      "djmain",
    ] },
  ], exclude = [
    "py311-dj60",
    "py311-dj61",
    "py311-djmain",
  ] },

]
# allowlist_externals = ["pytest"]

[tool.tox.env_run_base]
description = "Test combination of python {factor:python_version} and {factor:django_version}"
deps = [
  "pytest",
  { replace = "if", condition = "factor.dj52", then = [
    "django>=5.2,<6",
  ], extend = true },
  { replace = "if", condition = "factor.dj60", then = [
    "django>=6.0,<6.1",
  ], extend = true },
  { replace = "if", condition = "factor.dj61", then = [
    "django>=6.1,<6.2",
  ], extend = true },
  { replace = "if", condition = "factor.djmain", then = [
    "https://github.com/django/django/archive/main.tar.gz",
  ], extend = true },
]
commands = [
  [
    "pytest",
    "--cov=django_fsm_log",
    "--cov=tests",
    { replace = "posargs", extend = true },
  ],
]
dependency_groups = ["dev"]
set_env = { DJANGO_SETTINGS_MODULE = "tests.settings" }

[tool.tox.env.lint]
deps = ["ruff"]
skip_install = true
default_base_python = ["py315"]
commands = [
  [
    "ruff",
    "check",
    { replace = "posargs", default = [
      ".",
    ], extend = true },
  ],
  [
    "ruff",
    "format",
    "--check",
    { replace = "posargs", default = [
      ".",
    ], extend = true },
  ],
]
